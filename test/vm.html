/* ---------- modais ---------- */
#modal-root { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.modal-bg { position: absolute; inset: 0; background: #0009; display: grid; place-items: center; pointer-events: auto; animation: fadein .15s; backdrop-filter: blur(3px); }
@keyframes fadein { from { opacity: 0; } }
.modal { width: min(92vw, 640px); max-height: 90vh; overflow: auto; background: linear-gradient(#3a2416, #25150b); border: .2em solid #6a4a2a; border-radius: 18px; box-shadow: 0 20px 60px #000c; padding: 22px 24px; position: relative; animation: pop .18s; }
.modal.wide { width: min(94vw, 860px); }
@keyframes pop { from { transform: scale(.94); opacity: 0; } }
.modal h2 { margin: 0 0 14px; font-family: 'Lilita One', Impact, sans-serif; font-size: 30px; color: var(--yel1); text-shadow: 0 2px 0 #3a1a08; font-weight: 400; }

.modal p { margin: 6px 0; color: #e8d6b8; line-height: 1.45; font-size: 15px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1; }
.btn { padding: 11px 18px; border-radius: 11px; font-weight: 900; font-size: 16px; background: linear-gradient(#a06a38, #6c4020); border: 2px solid #2e170a; box-shadow: 0 3px 0 #3a1c0a; color: var(--cream); text-shadow: 0 1px 0 #2c170a; }
.btn:hover { filter: brightness(1.15); } .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #3a1c0a; }
.btn.y { background: linear-gradient(#ffe45a, #f0a000); color: #2b1a05; text-shadow: none; border-color: #b86a00; box-shadow: 0 3px 0 #a45800; }
.btn.g { background: linear-gradient(#58d94a, #2c9a24); border-color: #1a5a14; box-shadow: 0 3px 0 #1a5a14; }
.btn.r { background: linear-gradient(#f06a5a, #b82a1e); border-color: #6a1208; box-shadow: 0 3px 0 #6a1208; }
.btn.s { padding: 7px 12px; font-size: 14px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
input[type=text], select { background: #1a0f08; border: 2px solid #6a4a2a; border-radius: 10px; color: #fff; padding: 10px 12px; font-size: 17px; font-weight: 800; font-family: inherit; outline: none; }
input[type=text]:focus, select:focus { border-color: #ffc61a; }
input.code { text-transform: uppercase; letter-spacing: .3em; text-align: center; font-size: 28px; width: 100%; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.card { background: #1a0f08aa; border: 2px solid #6a4a2a; border-radius: 14px; padding: 14px; text-align: left; transition: transform .1s, border-color .1s; }
.card:hover { transform: translateY(-3px); border-color: #ffc61a; }
.card.sel { border-color: #ffc61a; background: #3a2a10cc; box-shadow: 0 0 0 2px #ffc61a55; }
.card b { font-size: 20px; display: block; color: var(--yel1); font-family: 'Lilita One', Impact, sans-serif; font-weight: 400; } .card small { display: block; color: #bda98a; margin-top: 3px; font-size: 13px; line-height: 1.35; font-weight: 700; } .card em { font-style: normal; color: #7ee06a; font-size: 12px; font-weight: 800; }
.field { display: grid; gap: 6px; margin: 8px 0; } .field label { font-size: 13px; color: #cdb892; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.seg { display: flex; border-radius: 10px; overflow: hidden; border: 2px solid #6a4a2a; } .seg button { flex: 1; padding: 9px 6px; background: #1a0f08; font-weight: 800; font-size: 14px; color: #cdb892; } .seg button.on { background: linear-gradient(#ffe45a, #f0a000); color: #2b1a05; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; } .tabs button { padding: 8px 14px; border-radius: 9px; background: #1a0f08; font-weight: 800; color: #cdb892; font-size: 14px; } .tabs button.on { background: #6a4020; color: #fff; }
.slider { display: flex; align-items: center; gap: 10px; } .slider input { flex: 1; accent-color: #ffc61a; } .slider b { width: 46px; text-align: right; font-size: 14px; }

.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px; } .skin { background: #1a0f08; border: 2px solid #6a4a2a; border-radius: 12px; padding: 6px; text-align: center; font-size: 12px; font-weight: 800; } .skin.sel { border-color: #ffc61a; } .skin canvas { width: 100%; image-rendering: pixelated; border-radius: 8px; }

.codebox { font-family: 'Lilita One', Impact, sans-serif; font-size: 42px; letter-spacing: .25em; color: var(--yel1); background: #1a0f08; border: 2px dashed #6a4a2a; border-radius: 12px; padding: 6px 16px; text-align: center; }
.kbd { background: #1a0f08; border: 1px solid #6a4a2a; border-radius: 6px; padding: 1px 7px; font-weight: 900; font-size: 13px; }
table.keys { width: 100%; border-collapse: collapse; font-size: 14px; } table.keys td { padding: 5px 4px; border-bottom: 1px solid #ffffff12; } table.keys td:first-child { width: 42%; color: #f3c13a; font-weight: 900; }

/* ---------- lobby (Chiqueiro) ---------- */
#lobby { background: radial-gradient(ellipse at 30% 20%, #0000, #000a); display: grid; place-items: center; }

.mem { display: flex; align-items: center; gap: 12px; background: #1a0f08aa; border: 2px solid #4a3018; border-radius: 12px; padding: 7px 12px; font-weight: 800; font-size: 17px; }
.mem canvas { width: 46px; height: 46px; border-radius: 9px; image-rendering: pixelated; } .mem .tag { margin-left: auto; font-size: 12px; padding: 3px 8px; border-radius: 7px; background: #ffc61a; color: #2b1a05; font-weight: 900; } .mem .png { font-size: 12px; color: #8ee27a; font-weight: 800; }

.cd { text-align: center; font-family: 'Lilita One', Impact, sans-serif; font-size: 22px; color: #ffe27a; min-height: 30px; }

/* ================= HUD (design 1920x1080) ================= */
#hud { font-size: calc(min(100vw / 1920, 100vh / 1080) * 10); pointer-events: none; z-index: 5; }
#hud > * { position: absolute; }
.panel { background: linear-gradient(#14181fd0, #0d1016d0); border: .14em solid #ffffff1c; border-radius: 1.1em; box-shadow: 0 .3em 1em #0005; }

#plist { right: 2em; top: 22em; width: 25em; padding: .8em 1em; font-size: 1.5em; }

.pr { display: flex; align-items: center; gap: .6em; padding: .15em .1em; font-weight: 800; font-size: .95em; } .pr .tb { width: .35em; height: 1.2em; border-radius: .2em; } .pr .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .pr .k { opacity: .8; font-variant-numeric: tabular-nums; } .pr.dead { opacity: .4; text-decoration: line-through; } .pr.me .nm { color: #ffe27a; }
#hints { left: 2em; bottom: 13em; font-size: 1.4em; font-weight: 800; line-height: 1.7; text-shadow: 0 .08em .3em #000; display: grid; gap: .1em; }

  /* ---------- ações (E, Q, H, comprar) ---------- */

  /* ---------- passo de tempo ---------- */

    if (p.m.y < this.W.waterY - 3.5 && this.W.waterDepth(p.m.x, p.m.z) > 2.5 && p.alive && this.t % 1 < dt) this.damage(p, null, 6, 'queda', 'body', p.m.x, p.m.y, p.m.z, { raw: true });

  settleCorpse(p, dt) {

  }

  /* ---------- helpers de spawn ---------- */
  spawnPoint(p, idx) {

  }
  placeAt(p, s) {

  /* ---------- snapshot (host → clientes) ---------- */

  }
  snapshot(forId, withSb, lootVer) {
    const b = this.bomb, s = {
      t: r3(this.t), tk: this.tick, ph: this.phase, pt: r2(this.pt), rd: this.round, mr: this.cfg.rounds, sc: this.score, sw: this.swap, ck: this.clockOn ? 1 : 0,
      P: this.players.map(p => this.snapPlayer(p)),
      G: this.nades.map(n => [n.id, r2(n.x), r2(n.y), r2(n.z), r2(n.vx), r2(n.vy), r2(n.vz), n.rest ? 1 : 0]),
      B: [b.st, r2(b.x), r2(b.y), r2(b.z), r2(b.timer), b.carrier, b.site, r2(b.defBy ? 1 : 0)],
      e: this.ev

    if (this.mode === 'caos') s.AL = this.alive().length;

    const me = forId && this.byId.get(forId); if (me) s.me = this.snapMe(me);

  }
}

/* =====================================================================
   41_rules.js — regras: partida, rodadas, bomba (mandioca), loot, zona
   ===================================================================== */
'use strict';
const ZONE_STAGES = [
  { wait: 50, shrink: 40, f: 0.62, dps: 1.4 }, { wait: 34, shrink: 32, f: 0.38, dps: 2.8 },
  { wait: 24, shrink: 26, f: 0.2, dps: 5.5 }, { wait: 14, shrink: 22, f: 0.06, dps: 10 }

function wpick(rng, list) { let s = 0; for (const e of list) s += e[1]; let r = rng.f() * s; for (const e of list) { r -= e[1]; if (r <= 0) return e[0]; } return list[0][0]; }

Object.assign(Sim.prototype, {
  /* ---------- partida ---------- */
  startMatch() {
    const hum = this.players.filter(p => !p.bot);
    /* equilibra esquadrões entre humanos */
    const cnt = [0, 0];
    for (const p of hum) { const s = cnt[0] < cnt[1] ? 0 : cnt[1] < cnt[0] ? 1 : (this.rng.chance(.5) ? 0 : 1); p.squad = s; cnt[s]++; }
    this.fillBots();
    this.score = [0, 0]; this.round = 0; this.over = false; this.winner = null; this.matchDone = false; this.matchT = 0;
    for (const p of this.players) { p.k = p.d = p.a = p.hs = p.dmg = p.plants = p.defuses = p.score = 0; p.place = 0; }
    this.startRound();
  },
  fillBots() {
    if (!this.cfg.fill) return;
    const used = new Set(this.players.map(p => p.name)), names = BOT_NAMES.filter(n => !used.has(n));
    for (let i = names.length - 1; i > 0; i--) { const j = this.rng.int(0, i); const t = names[i]; names[i] = names[j]; names[j] = t; }
    const add = sq => this.addPlayer({ name: names.pop() || ('Peão' + this.nextId), skin: this.rng.int(0, SKINS.length - 1), bot: true, squad: sq });
    if (this.mode === 'tatico') {
      const per = clamp(this.cfg.perTeam | 0, 3, this.M.max / 2);
      for (const sq of [0, 1]) { let n = this.players.filter(p => p.squad === sq).length; while (n < per) { add(sq); n++; } }
    } else {
      const total = clamp(this.cfg.total || 12, this.players.length, this.M.max);
      while (this.players.length < total) add(0);
    }
  },
  startRound() {
    this.round++; this.nades.length = 0; this.loot.length = 0; this.lootVer = (this.lootVer | 0) + 1;
    this.swap = this.mode === 'tatico' ? ((this.round - 1) & 1) : 0;
    const idx = [0, 0, 0];
    this.bomb = { st: 'none', x: 0, y: 0, z: 0, carrier: 0, timer: 0, site: '', lockT: 0, dchk: 0, defBy: 0, planter: 0, beep: 0 };
    this.clockOn = true; this.endInfo = null;
    let i = 0;
    for (const p of this.players) {
      p.team = this.teamOf(p); p.alive = true; p.hp = SIMC.HP; p.dmgBy = {}; p.useT = 0; p.useK = ''; p.useLock = false; p.lastDmgT = -99; p.healT = 0; p.shotsRun = 0; p.multi = 0;
      if (p.bot) p.loadout = this.rng.pick(['galho', 'galho', 'galho', 'colher', 'colher', 'vassoura']);
      this.loadout(p);
      const s = this.spawnPoint(p, this.mode === 'tatico' ? idx[p.team]++ : i++);
      this.placeAt(p, s);
      if (p.ai) p.ai.reset(this, p);
    }
    if (this.mode === 'tatico') {
      const atk = this.players.filter(p => p.team === T_ATK);
      if (atk.length) { const c = this.rng.pick(atk); c.hasBomb = true; this.bomb.st = 'carried'; this.bomb.carrier = c.id; }
      this.zone = null;
    } else this.initCaos();

    this.emit({ t: 'round', n: this.round, sw: this.swap });
  },
  stepPhase(dt) {
    switch (this.phase) {
      case 'prep': this.pt -= dt; this.liveT = 0; if (this.pt <= 0) { this.phase = 'live'; this.pt = this.mode === 'tatico' ? this.M.roundTime : 0; this.emit({ t: 'live' }); } break;
      case 'live': this.liveT = (this.liveT || 0) + dt; if (this.mode === 'tatico') { if (this.clockOn) this.pt = Math.max(0, this.pt - dt); } else this.pt += dt; break;
      case 'post': this.pt -= dt; if (this.pt <= 0) { if (this.matchDone) { this.phase = 'over'; this.over = true; this.emit({ t: 'over', w: this.winner }); } else this.startRound(); } break;
    }
  },
  stepRules(dt) {

  },

  /* ---------- tático: rodadas + bomba ---------- */
  rulesTatico(dt) {
    const b = this.bomb;
    if (b.lockT > 0) b.lockT -= dt;
    if (b.defBy) { const d = this.byId.get(b.defBy); if (!d || !d.alive || d.useK !== 'defuse') b.defBy = 0; }
    if (b.st === 'planted') { b.timer -= dt; if (b.timer <= 0) { this.explodeBomb(); return; } }
    let atk = 0, def = 0;
    for (const p of this.players) if (p.alive) { if (p.team === T_ATK) atk++; else def++; }
    if (atk === 0 && def === 0) this.endRound(b.st === 'planted' ? T_ATK : T_DEF, 'elim');

  },
  endRound(winTeam, reason) {

    this.phase = 'post'; this.pt = this.M.endDelay;
    const need = Math.ceil(this.cfg.rounds / 2);
    if (this.score[ws] >= need || (this.round >= this.cfg.rounds && this.score[0] !== this.score[1])) { this.matchDone = true; this.winner = this.score[0] > this.score[1] ? 0 : 1; this.pt = this.M.endDelay + 2; }
    this.endInfo = { round: this.round, winTeam, winSquad: ws, reason };
    this.emit({ t: 'rend', n: this.round, wt: winTeam, ws, why: reason, sc: this.score.slice(), md: this.matchDone ? 1 : 0, wn: this.winner });
  },
  inSite(p) {

    return null;
  },
  distBomb(p) { const b = this.bomb; return Math.hypot(p.m.x - b.x, p.m.z - b.z) + Math.abs((p.m.y + 0.5) - b.y) * 0.5; },
  cancelUse(p) {

    if (p.useK) this.emit({ t: 'bomb', k: 'cancel', p: p.id });

  },
  handleUse(p, c, dt) {
    const edge = c.use && !p.useHeld; p.useHeld = c.use;
    if (!c.use) p.useLock = false;
    if (this.phase !== 'live') { if (p.useK) { p.useK = ''; p.useT = 0; } return; }
    if (this.mode === 'caos') { if (edge) this.tryPickup(p); if (((this.tick + p.id.length) & 7) === 0) this.autoPickup(p); return; }
    const b = this.bomb, M = this.M;
    if (p.useK === 'plant') {

      if (p.hasBomb && b.st === 'carried' && p.m.gnd && p.m.mant <= 0) {

      }
    } else if (p.team === T_DEF) {

        p.useK = 'defuse'; p.useT = b.dchk + 0.0001; p.useMax = M.defuseTime; b.defBy = p.id; p.ads = false; this.emit({ t: 'bomb', k: 'defStart', p: p.id });
      }
    }
  },
  pickBomb(p) {
    const b = this.bomb; b.st = 'carried'; b.carrier = p.id; p.hasBomb = true;
    this.emit({ t: 'bomb', k: 'pick', p: p.id });
  },
  dropBomb(p, onDeath) {

    p.hasBomb = false; b.st = 'dropped'; b.carrier = 0; b.lockT = onDeath ? 0.3 : 0.9;
    const f = aimVec(p.m.yaw, 0, { x: 0, y: 0, z: 0 }); let d = onDeath ? 0 : 0.95, x = p.m.x + f.x * d, z = p.m.z + f.z * d;
    if (d && this.W.solidAt(x, p.m.y + 0.5, z)) { x = p.m.x; z = p.m.z; }
    b.x = x; b.z = z; b.y = Math.max(this.floorY(x, z, p.m.y + 0.3), p.m.y - 0.3);
    if (p.w === 'mandioca') { const g = ownedSlots(p).find(i => isGun(i)) || 'faca'; switchWeapon(p, g, null); }

  defuseBomb(p) {

  },

  }
}
